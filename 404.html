<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page not found — The Grounded Mama</title>
<meta name="robots" content="noindex" />
<meta http-equiv="refresh" content="4;url=/" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
<style>
  :root{ --cream:#FAF6F0; --charcoal:#3D3532; --rose:#C9837A; }
  *{box-sizing:border-box;margin:0;}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg,#FBE7E2,var(--cream));
    font-family:'Inter',system-ui,sans-serif;color:var(--charcoal);text-align:center;padding:24px;}
  .card{max-width:30rem;}
  .emoji{font-size:3rem;}
  h1{font-family:'Playfair Display',serif;font-size:clamp(1.6rem,5vw,2.4rem);margin:.6rem 0 .4rem;}
  p{color:#6c605b;line-height:1.6;margin-bottom:1.6rem;}
  a{display:inline-block;background:var(--rose);color:#fff;text-decoration:none;font-weight:600;
    padding:.85rem 1.8rem;border-radius:999px;transition:transform .15s ease;}
  a:hover{transform:translateY(-2px);}
  small{display:block;margin-top:1.2rem;color:#9a8f89;}
</style>
</head>
<body>
  <div class="card">
    <div class="emoji">🌙</div>
    <h1>This page slipped off for a nap.</h1>
    <p>We couldn't find what you were looking for — but everything else is right where you left it.</p>
    <a href="/">Back to The Grounded Mama</a>
    <small>Taking you home automatically…</small>
  </div>
</body>
